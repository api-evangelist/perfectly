aid: perfectly
name: Perfectly
description: >-
  Perfectly is an AI-native recruiting platform (Y Combinator W2026) that automates the
  hiring process end to end, from candidate sourcing and outreach through screening and
  qualification. Its employer-facing AI recruiting agent, Paul, sources, engages, and
  qualifies candidates to help startups fill roles in days rather than weeks, delivered
  as an AI-native recruiting agency paired with a forward-deployed recruiter for onboarding
  and configuration. Its job-seeker agent, Parker, is an AI career super-connector on
  iMessage and WhatsApp that helps candidates find relevant industry contacts and craft
  personalized outreach before roles are publicly posted. Founded by former ML scientists
  and engineers from Meta and TikTok, Perfectly operates as a chat- and agent-delivered
  hiring service rather than a public developer API; no public API, developer portal, SDK,
  or specification surface was found during enrichment.
